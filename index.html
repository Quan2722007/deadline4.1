<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="main.css">
  </head>
  <body>
    <div class="Form">
      <header>
        <div class="letter">
          <h1>Jackson</h1>
        </div>
        <div><hr style="border: 3px solid black;"></div>
        <div class="letter">
          <h1>Electronics</h1>
        </div>
      </header>
      <br />
      <h2>Registration Form</h2>
      <warrper>
        <p>Register your Jackson Electronics product here</p>
        <table>
          <tr>
            <td>FirstName:</td>
            <td class="distance"><input type="text" name="firstname" size="12"/> LastName: <input type="text" name="LastName" size="12"/></td>
            <td></td>
          </tr>
          <tr>
            <td>Address#1:</td>
            <td colspan="3">
              <input type="text" name="address#1" size="20" />
            </td>
          </tr>
          <tr>
            <td>Address#2:</td>
            <td colspan="3">
              <input type="text" name="address#2" size="20" />
            </td>
          </tr>
          <tr>
            <td>City:</td>
            <td><input type="text" name="city" size="15"/> State: <input type="text" name="state" size="2" /> Zip:
              <input type="text" name="zip" size="6" /></td>
          </tr>
          <tr>
            <td>Country:</td>
            <td colspan="4"><input type="text" value="United States" size="15"/></td>
          </tr>
          <tr>
            <td colspan="4">
              <hr />
            </td>
          </tr>
          <tr>
            <td>Product:</td>
            <td>
              <select name="product">
                <option>ScanMaster</option>
              </select>
            </td>
          </tr>
          <tr>
            <td>Date Purchased:</td>
            <td><input type="text" name="date" size="15"/></td>
          </tr>
          <tr>
            <td>Serial#:</td>
            <td><input type="text" name="serial" size="15"/></td>
          </tr>
          <tr>
             <td><label>User for:</label></td>
              <td><input type="radio" name="User"><label style="margin-right: 100px;">Home</label><input type="radio" name="User"><label>Educational Institution</label></td>
          </tr>
          <tr>
             <td></td>
             <td><input type="radio" name="User"><label style="margin-right: 79.5px;">Business</label><input type="radio" name="User"><label>Other</label></td>
          </tr>
          <tr>
              <td></td>
              <td><input type="radio" name="User"><label>Government</label></td>
          </tr>
                <tr>
                  <td>Sytem (check all that apply)</td>
                  <td><input type="checkbox" name="system"><label style="margin-right: 80px;">Windows</label><input type="checkbox" name="system"><label>UNIX</label></td>
                  <td></td>
                </tr>
                <tr>
                  <td></td>
                  <td><input type="checkbox" name="system"><label style="margin-right: 70.5px;">Macintosh</label><input type="checkbox" name="system" ><label>Other</label></td>
                </tr>
              <tr>
                <td colspan="4">
                  <hr>
                </td>
              </tr>
                <tr>
                  <td>Comments?:</td>
                  <td colspan="3"><textarea style="width: 90%; height: 100px;"></textarea></td>
                </tr>
                <td>
                  <td>
                    <input type="submit" name="cmd" value="Click to register"> 
                    <input type="submit" name="cmd" value="Click to cancel">
                  </td>
                </tr>
          </tr>
        </table>
      </warrper>
    </div>
  </body>
</html>
